<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F9E6D1">
<title>慢寶</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  /* 底色跟慢寶插畫的背景一致，牠才貼得無縫 */
  --bg:        #F9E6D1;
  --surface:   #FFFCF7;
  --line:      #E8D5BE;
  --text:      #4A3B32;
  --muted:     #8A7361;
  --faint:     #A89380;
  --brand:     #B0724F;
  --brand-dim: #C9977A;
  --gold:      #D9A441;
  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 26px;
  --shadow: 0 2px 10px rgba(120, 90, 60, 0.07);
  --tray-h: 62px;
}
/* 招呼畫面不要底部菜單條 */
body.no-tray { --tray-h: 0px; }
body.no-tray .tray { display: none; }

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;                 /* 捲動交給各頁自己處理 */
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px;
  line-height: 1.6;
}

button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img { display: block; max-width: 100%; }

/* ─────────── 頁面容器與轉場 ─────────── */

#viewport {
  position: fixed;
  inset: 0 0 var(--tray-h) 0;
  overflow: hidden;
}

.page {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;               /* 對話框的 SVG 四周留了透明餘裕，會撐出橫向捲動 */
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  padding: env(safe-area-inset-top) 0 24px;
}

/* 前進：新頁從右邊進來。後退：新頁從左邊進來 */
@keyframes slideInRight { from { transform: translateX(100%); } to { transform: none; } }
@keyframes slideInLeft  { from { transform: translateX(-30%); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes slideOutLeft { from { transform: none; } to { transform: translateX(-30%); opacity: .6; } }
@keyframes slideOutRight{ from { transform: none; } to { transform: translateX(100%); } }

.page.in-fwd  { animation: slideInRight .26s cubic-bezier(.32,.72,0,1) both; }
.page.in-back { animation: slideInLeft  .26s cubic-bezier(.32,.72,0,1) both; }
.page.out-fwd { animation: slideOutLeft .26s cubic-bezier(.32,.72,0,1) both; }
.page.out-back{ animation: slideOutRight .26s cubic-bezier(.32,.72,0,1) both; }

@media (prefers-reduced-motion: reduce) {
  .page.in-fwd, .page.in-back, .page.out-fwd, .page.out-back { animation-duration: .01s; }
}

.wrap { max-width: 720px; margin: 0 auto; padding: 0 14px; }

/* ─────────── 頂端列 ─────────── */

.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: 14px 20px 12px;
  background: linear-gradient(var(--bg) 86%, transparent);
}
.back-btn {
  width: 36px; height: 36px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 19px; color: var(--brand);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.back-btn:active { transform: scale(.93); }
.topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
.topbar .sub { font-size: 12px; color: var(--faint); }

/* ─────────── 首頁 ─────────── */

.home {
  min-height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px 8px 12px;              /* 左右留很少，插畫要放得開 */
  text-align: center;
}

/* ── 對話框 ──
   泡泡和尾巴是「同一條封閉路徑」，所以接縫不可能存在。
   路徑由 JS 依實際文字尺寸算出來，尾尖座標指定成對準慢寶。 */
.bub {
  position: relative;
  z-index: 2;                        /* 尾巴會伸進慢寶那張圖，不能被蓋掉 */
  display: inline-block;
  padding: 14px 22px;
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  animation: pop .32s cubic-bezier(.34,1.5,.64,1) both;
}
.bub > span { position: relative; z-index: 1; text-wrap: balance; }
.bub > svg {
  position: absolute;
  overflow: visible;
  pointer-events: none;
  filter: url(#wobble);
  transform: translateZ(0);          /* 自成一層 —— 不然別處一重繪，濾鏡就重算一次，會閃 */
}
.bub > svg path {
  fill: var(--surface);
  stroke: var(--line);
  stroke-width: 2.2;
  stroke-linejoin: round;
}
@keyframes pop { from { opacity: 0; transform: translateY(7px) scale(.95); } to { opacity: 1; transform: none; } }

/* 招呼頁的標題 —— 牠在睡，不該講話，所以這裡放的是 app 的名字 */
.wordmark { margin-bottom: 18px; animation: pop .4s cubic-bezier(.34,1.5,.64,1) both; }
.wm-name {
  font-size: 34px; font-weight: 700;
  letter-spacing: 8px; text-indent: 8px;      /* 字距補償，視覺才置中 */
  color: var(--text);
}
.wm-sub {
  font-size: 13px; letter-spacing: 3px; text-indent: 3px;
  color: var(--faint); margin-top: 6px;
}

/* 首頁慢寶前後晃。
   整張圖一起轉的話樹枝也會歪 —— 所以同一張圖疊兩層：
   下層是會晃的身體，上層只露出樹枝那一段、靜止不動，順便蓋住接縫。 */
.bo-stage { position: relative; }
.bo-swing {
  transform-origin: 50% 14%;         /* 支點在牠抓著樹枝的地方 */
  animation: sway 4.6s ease-in-out infinite;
}
.bo-branch {
  position: absolute; inset: 0;
  width: 100%;
  clip-path: inset(0 0 83% 0);       /* 樹枝在 6%–15%，多留一點蓋住接縫 */
  pointer-events: none;
}
@keyframes sway {
  0%, 100% { transform: rotate(-1.4deg); }
  50%      { transform: rotate(1.4deg); }
}


@media (prefers-reduced-motion: reduce) { .bo-swing { animation: none; } }

/* 慢寶全身站著說話：牠在左，話在右，尾尖指向牠的頭 */
.bo-talk { display: flex; align-items: flex-start; margin: 18px 12px 0; }
.bo-talk > img { width: 104px; flex: none; margin-top: 6px; }
.bo-talk .bub {
  flex: 1;
  margin-left: -14px;              /* 壓住鍋子邊緣就好 —— 壓太多會戳到臉 */
  padding: 13px 16px;
  font-size: 13.5px; line-height: 1.75; color: var(--muted);
}

/* 菜單頁的慢寶 —— 牠站中間偏左，泡泡往右延伸到跟清單同一個邊界 */
.bo-talk.wait { align-items: center; margin: 4px 14px 0; padding-left: 14px; }
.bo-talk.wait > img { width: 132px; margin-top: 0; }
.bo-talk.wait .bub { flex: 1; max-width: none; margin-left: -12px; }

.home .bub { margin-bottom: 8px; }

/* 插畫要依畫面高度收斂 —— 手機上不設上限的話，內容會超過視窗，
   而 flex 置中時上方溢出的部分是捲不到的（對話框就這樣消失了）。
   用寬高比換算成寬度上限，樹枝那層才會跟著一起縮。 */
.bo-stage { width: 100%; max-width: 430px; margin: 0 auto; }
.bo-stage img { width: 100%; }
.bo-stage.sleep { width: min(100%, 400px, 54vh); }    /* 640x505，比 1.267 */
.bo-stage.drape { width: min(100%, 240px, 25vh); }    /* 560x721，比 0.777 —— 要留位置給兩個入口 */

.tap-hint {
  font-size: 12px; color: var(--faint); letter-spacing: 2px;
  margin-top: 18px; animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

.gate { display: grid; gap: 12px; width: 100%; max-width: 330px; margin-top: 20px; }
.gate button {
  border-radius: var(--r-md);
  padding: 16px 18px;
  text-align: left;
  background: var(--surface);
  box-shadow: var(--shadow);
  border: 1.5px solid transparent;
  transition: border-color .15s, transform .12s;
}
.gate button:active { transform: scale(.98); }
.gate .g-t { font-size: 15.5px; font-weight: 700; }
.gate .g-s { font-size: 12.5px; color: var(--faint); margin-top: 2px; }
.gate .primary { border-color: var(--brand-dim); }

/* ─────────── 食譜牆 ─────────── */

.search {
  position: relative; margin: 0 14px 14px;
}
.search input {
  width: 100%;
  border: 1.5px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-pill, 999px);
  padding: 11px 40px 11px 18px;
  font-size: 14px; font-family: inherit; color: var(--text);
  outline: none;
}
.search input:focus { border-color: var(--brand-dim); }
.search .clr {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 50%;
  color: var(--faint); font-size: 15px;
  display: none; place-items: center;
}
.search .clr.on { display: grid; }

/* 兩欄的紙片牆 —— 一次看得到四張，一百道也滑得完。
   新的插畫是平塗簡化的，縮小後照樣認得出來（舊的照片就不行）。 */
/* 木紋暗示 —— 淡到幾乎只是質感，圖的米色底才不會浮出方框 */
#wall-bg {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background:
    repeating-linear-gradient(90deg,
      rgba(176,114,79,.030) 0px, rgba(176,114,79,.030) 2px,
      transparent 2px, transparent 9px),
    repeating-linear-gradient(90deg,
      rgba(176,114,79,.018) 0px, rgba(176,114,79,.018) 1px,
      transparent 1px, transparent 23px);
}
.grid { display: grid; gap: 16px 12px; grid-template-columns: 1fr 1fr; }
@media (min-width: 620px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.card {
  position: relative;
  padding: 24px 9px 12px;          /* 上方多留白，圖釘才像釘在紙上而不是卡在邊上 */
  transition: transform .12s;
}
.card:active { transform: scale(.97); }

/* 紙：手繪抖動邊，跟對話框同一套濾鏡 —— 這是整個 app 最獨特的特徵 */
.card::before {
  content: ''; position: absolute; inset: 0; z-index: 0;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 16px 13px 15px 12px / 13px 16px 12px 15px;
  filter: url(#wobble);
  transform: translateZ(0);
}
.card > * { position: relative; z-index: 1; }

/* 圖釘 */
.card::after {
  content: ''; position: absolute; z-index: 2;
  left: 50%; top: 8px; margin-left: -5.5px;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 1px 3px rgba(120,90,60,.35), inset -1px -1px 0 rgba(0,0,0,.12);
}

.card-img {
  width: 100%; aspect-ratio: 4 / 3;
  object-fit: cover; background: var(--bg);
  border-radius: 10px;
}
.card-b { padding: 9px 3px 0; }
.card-t { font-size: 13.5px; font-weight: 700; line-height: 1.4; }
.card-m { font-size: 11.5px; color: var(--muted); margin-top: 5px; display: flex; gap: 10px; }
.card-m i { display: none; }

/* ＋ 加入今日菜單 */
.add-btn {
  position: absolute; z-index: 3;
  right: 4px; bottom: 6px;
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 18px; line-height: 1;
  background: var(--surface); color: var(--brand);
  border: 1.5px solid var(--line);
  box-shadow: 0 2px 6px rgba(120,90,60,.14);
  transition: transform .14s, background .14s, color .14s;
}
.add-btn:active { transform: scale(.88); }
.add-btn.on { background: var(--brand); border-color: var(--brand); color: #fff; }

.empty { text-align: center; color: var(--faint); font-size: 13.5px; padding: 40px 20px; }

/* ─────────── 食譜詳情 ─────────── */

/* 封面：圖 → 決定卡疊上來。一屏之內就能決定要不要煮 */
.r-hero { width: 100%; height: 246px; object-fit: cover; background: var(--line); }
.r-card {
  position: relative;
  margin: -30px 14px 0;
  padding: 18px 18px 16px;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: 0 4px 18px rgba(120,90,60,.10);
}
.r-title { font-size: 21px; font-weight: 700; line-height: 1.32; }
.r-sub { font-size: 12.5px; color: var(--faint); margin-top: 3px; }
.r-stats {
  display: flex; align-items: center; gap: 0;
  margin: 14px 0 15px;
}
.r-stat { flex: 1; }
.r-stat + .r-stat { border-left: 1px solid var(--line); padding-left: 14px; }
.r-stat .k { font-size: 10.5px; letter-spacing: 1.5px; color: var(--faint); }
.r-stat .v { font-size: 14.5px; font-weight: 700; margin-top: 2px; white-space: nowrap; }
.r-stat .tn { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
.portion { display: flex; align-items: center; gap: 3px; margin-top: 1px; }

.r-add {
  width: 100%; padding: 13px;
  border-radius: var(--r-md);
  background: var(--brand); color: #fff;
  font-size: 14.5px; font-weight: 700; letter-spacing: .5px;
  transition: transform .12s, background .15s;
}
.r-add:active { transform: scale(.98); }
.r-add.on { background: var(--gold); color: var(--text); }

/* 備料 / 步驟 分頁 —— 跟今日菜單同一套體例 */
.r-tabs { display: flex; gap: 4px; margin: 22px 14px 14px; }
.r-tabs button {
  flex: 1; padding: 10px 0; font-size: 14px; border-radius: 999px;
  color: var(--muted); background: var(--surface);
}
.r-tabs button.on { background: var(--brand); color: #fff; font-weight: 700; }
.portion button {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1.5px solid var(--line); font-size: 16px; color: var(--brand);
  display: grid; place-items: center;
}
.portion button:active { background: var(--line); }
.portion .n { min-width: 26px; text-align: center; font-weight: 700; }

.sect { margin: 26px 20px 0; }
.sect-t {
  font-size: 12px; letter-spacing: 2px; color: var(--brand);
  font-weight: 700; padding-bottom: 7px; border-bottom: 1.5px solid var(--line);
  margin-bottom: 12px;
}
.ing { padding: 11px 2px; font-size: 15.5px; }
.ing + .ing { border-top: 1px dashed var(--line); }
.ing-head { display: flex; justify-content: space-between; gap: 14px; }
.ing .amt { color: var(--muted); white-space: nowrap; }
/* 怎麼處理，跟份量放同一格 —— 使用者不必再去步驟頁找 */
.ing-how { font-size: 13.5px; color: var(--faint); line-height: 1.6; margin-top: 2px; padding-right: 40px; }
.from-prep {
  font-size: 12px; color: var(--faint); letter-spacing: 1px;
  padding: 2px 2px 14px;
}
/* 醬汁／醃料：一組有名字的東西，不是一堆散落的調味料 */
.ing-set {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 14px 6px;
  margin: 12px 0;
}
.ing-set-name {
  font-size: 13px; font-weight: 700; color: var(--gold);
  letter-spacing: .5px;
}
.ing-set-note { font-size: 12px; color: var(--faint); line-height: 1.6; margin-top: 3px; }
.ing-set-body { margin-top: 8px; }
.ing-set-body .ing { padding: 6px 0; font-size: 13.5px; }
.ing-set-body .ing:first-child { border-top: 1px dashed var(--line); padding-top: 9px; }
.paren { font-size: 11.5px; color: var(--faint); }

.phase { font-size: 13px; letter-spacing: 2px; color: var(--brand-dim); font-weight: 700; margin: 18px 0 8px; }
.phase:first-child { margin-top: 0; }
ol.steps { list-style: none; counter-reset: s; }
ol.steps li {
  counter-increment: s; position: relative;
  padding: 10px 0 10px 34px; font-size: 16.5px; line-height: 1.85;
}
ol.steps li::before {
  content: counter(s); position: absolute; left: 0; top: 12px;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--line); color: var(--brand);
  font-size: 11px; font-weight: 700;
  display: grid; place-items: center;
}
ol.steps strong { color: var(--brand); font-weight: 700; }
.tips li { font-size: 14.5px; color: var(--muted); padding: 6px 0 6px 16px; position: relative; list-style: none; }
.tips li::before { content: '·'; position: absolute; left: 4px; color: var(--gold); font-weight: 700; }

/* ─────────── 今日菜單 ─────────── */

.tray {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  height: calc(var(--tray-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: flex; align-items: center; gap: 12px;
  padding-left: 18px; padding-right: 14px;
  background: var(--surface);
  border-top: 1px solid var(--line);
  box-shadow: 0 -2px 14px rgba(120,90,60,.06);
}
.tray-face { width: 42px; flex: none; }
/* 慢寶在底部一直都在，這裡就是牠的嘴巴 */
.tray-txt { flex: 1; font-size: 13.5px; line-height: 1.4; color: var(--muted); }
.tray-go {
  position: relative;
  background: var(--brand); color: #fff;
  border-radius: 999px; padding: 9px 17px;
  font-size: 13px; font-weight: 700; letter-spacing: .5px;
  flex: none;
}
.tray-go:active { transform: scale(.95); }
.tray-go.finish { background: var(--gold); color: var(--text); }
.tray-badge {
  position: absolute; top: -5px; right: -5px;
  min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: 999px;
  background: var(--gold); color: #4A3B32;
  font-size: 11.5px; line-height: 20px; text-align: center;
  box-shadow: 0 1px 4px rgba(120,90,60,.25);
}

.tabs { display: flex; gap: 4px; margin: 4px 20px 16px; }
.tabs button {
  flex: 1; padding: 9px 0; font-size: 13.5px; border-radius: 999px;
  color: var(--muted); background: var(--surface);
}
.tabs button.on { background: var(--brand); color: #fff; font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 20px 18px; }
.chip {
  display: flex; align-items: center; gap: 7px;
  background: var(--surface); border-radius: 999px;
  padding: 6px 8px 6px 14px; font-size: 13px; box-shadow: var(--shadow);
}
.chip button { color: var(--faint); font-size: 15px; line-height: 1; padding: 0 3px; }

.grp-h {
  font-size: 11px; letter-spacing: 2px; color: var(--faint);
  background: rgba(255,255,255,.5); padding: 8px 14px;
  border-radius: var(--r-sm); margin: 16px 0 6px;
}
.row { display: flex; justify-content: space-between; gap: 14px; padding: 8px 14px; font-size: 14px; }
.row + .row { border-top: 1px dashed var(--line); }
.row .r-amt { color: var(--muted); white-space: nowrap; }
.row .r-from { font-size: 11px; color: var(--faint); }

/* 買菜清單的一列：勾選圈 · 品名 · 份量 · 家裡已經有 */
.row.buy { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
.row.buy .r-name { flex: 1; }
.row.buy .r-amt { color: var(--muted); white-space: nowrap; }
.tick {
  width: 21px; height: 21px; flex: none;
  border: 1.6px solid var(--line); border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; color: transparent;
  transition: background .15s, border-color .15s, color .15s;
}
.row.buy.got .tick { background: var(--brand); border-color: var(--brand); color: #fff; }
.row.buy.got .r-name,
.row.buy.got .r-amt { color: var(--faint); text-decoration: line-through; }
.rm { flex: none; color: var(--line); font-size: 13px; padding: 2px 4px; }
.rm:hover { color: var(--brand-dim); }


.have-box { margin: 18px 0 4px; padding: 12px 14px; border: 1.5px dashed var(--line); border-radius: var(--r-md); }
.have-t { font-size: 11.5px; letter-spacing: 1.5px; color: var(--faint); margin-bottom: 8px; }
.have-chip {
  font-size: 12.5px; color: var(--muted);
  background: var(--surface); border: 1px solid var(--line);

<!-- 改完 recipes.js 就把 v 往上加一號，不然瀏覽器會一直吃舊的快取 -->
<script src="recipes.js?v=9"></script>
<script>
/* ══════════════════════════════════════════════
   慢寶 · 骨架
   路由用 hash，瀏覽器／手機的上一頁自動就會動
   ══════════════════════════════════════════════ */

/* 素材版本。換過圖就 bump 一次，否則瀏覽器會一直用舊的快取 */
const ASSETS = '10';
const asset = p => p + '?v=' + ASSETS;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 狀態 ── */
const KEY = 'bo_menu';
let menu = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
const saveMenu = () => localStorage.setItem(KEY, JSON.stringify([...menu]));

let portions = 2;

/* ── 慢寶 ── */
const BO = {
  hang:    asset('bo/hang_u.webp'),
  sleep:   asset('bo/hang_sleep.webp'),   // 招呼頁：牠還在睡
  drape:   asset('bo/hang_drape.webp'),
  cookA:   asset('bo/cook_bowl.webp'),
  cookB:   asset('bo/cook_pan.webp'),
  sleepy:  asset('bo/face_sleepy.webp'),
  satisfied:asset('bo/face_satisfied.webp'),
  cheeky:  asset('bo/face_cheeky.webp'),
  blank:   asset('bo/face_blank.webp'),
  thinking:asset('bo/face_thinking.webp'),
  surprised:asset('bo/face_surprised.webp'),
};

/* ══════════ 對話框 ══════════
   泡泡＋尾巴＝一條封閉路徑。分成兩個元素畫，抖動濾鏡會讓兩條邊線錯開，
   中間就會出現一條接縫 —— 所以整個外框必須是同一條 path。 */

/* 尾巴只從一邊伸出去，所以餘裕只留那一側 ——
   四邊都留 46px 的話，泡泡一撐到接近滿寬就會多出橫向捲動區。 */
const BUB_EDGE = 8;                 // 線寬和抖動位移的餘裕

function bubPad(tail) {
  const len = (tail.len || 30) + 14;
  return {
    l: tail.side === 'left'   ? len : BUB_EDGE,
    r: tail.side === 'right'  ? len : BUB_EDGE,
    t: BUB_EDGE,
    b: tail.side === 'bottom' ? len : BUB_EDGE,
  };
}

/* w,h = 泡泡本體尺寸；tail = {side, at, len} —— at 是尾尖沿著該邊的位置 */
function bubblePath(w, h, tail) {
  const p = bubPad(tail);
  const R = 24;                     // 圓角；四角刻意給一點差異，才不像 Word
  const r1 = R + 4, r2 = R - 3, r3 = R + 2, r4 = R - 1;
  const x0 = p.l, y0 = p.t, x1 = p.l + w, y1 = p.t + h;
  const half = tail.half || 15;     // 尾巴根部半寬
  const len = tail.len || 30;

  const seg = [];
  seg.push(`M ${x0 + r1} ${y0}`);
  seg.push(`H ${x1 - r2} Q ${x1} ${y0} ${x1} ${y0 + r2}`);

  if (tail.side === 'right') {
    const ty = y0 + tail.at;
    seg.push(`V ${ty - half}`);
    seg.push(`Q ${x1 + len * .55} ${ty - half * .5} ${x1 + len} ${ty}`);
    seg.push(`Q ${x1 + len * .45} ${ty + half * .9} ${x1} ${ty + half}`);
  }
  seg.push(`V ${y1 - r3} Q ${x1} ${y1} ${x1 - r3} ${y1}`);

  if (tail.side === 'bottom') {
    const tx = x0 + tail.at;
    seg.push(`H ${tx + half}`);
    seg.push(`Q ${tx + half * .5} ${y1 + len * .55} ${tx} ${y1 + len}`);
    seg.push(`Q ${tx - half * .9} ${y1 + len * .45} ${tx - half} ${y1}`);
  }
  seg.push(`H ${x0 + r4} Q ${x0} ${y1} ${x0} ${y1 - r4}`);

  if (tail.side === 'left') {
    const ty = y0 + tail.at;
    seg.push(`V ${ty + half}`);
    seg.push(`Q ${x0 - len * .55} ${ty + half * .5} ${x0 - len} ${ty}`);
    seg.push(`Q ${x0 - len * .45} ${ty - half * .9} ${x0} ${ty - half}`);
  }
  seg.push(`V ${y0 + r1} Q ${x0} ${y0} ${x0 + r1} ${y0} Z`);
  return seg.join(' ');
}

/* 量完實際尺寸再畫。
   字型載入前後、換行變化都會改尺寸 —— 所以用 ResizeObserver 盯著，不是畫一次就算了。 */
const bubRO = new ResizeObserver(entries => entries.forEach(e => drawBubble(e.target)));

function drawBubble(el) {
  const w = el.offsetWidth, h = el.offsetHeight;
  if (!w || !h) return;
  const side = el.dataset.tail || 'bottom';
  // at：尾尖沿著那條邊的位置。可寫百分比（"30%"）讓它跟著泡泡寬度走
  const raw = el.dataset.at;
  const span = side === 'bottom' ? w : h;
  const at = raw
    ? (raw.endsWith('%') ? span * parseFloat(raw) / 100 : +raw)
    : (side === 'bottom' ? w / 2 : Math.min(32, h / 2));
  const tail = { side, at, len: +(el.dataset.len || 30), half: +(el.dataset.half || 15) };
  const p = bubPad(tail);
  const d = bubblePath(w, h, tail);
  let svg = el.querySelector(':scope > svg');
  if (!svg) {
    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'path'));
    el.prepend(svg);
  }
  svg.setAttribute('width', w + p.l + p.r);
  svg.setAttribute('height', h + p.t + p.b);
  svg.style.left = -p.l + 'px';
  svg.style.top  = -p.t + 'px';
  svg.querySelector('path').setAttribute('d', d);
}

function layoutBubbles(root) {
  (root || document).querySelectorAll('.bub').forEach(el => {
    drawBubble(el);
    bubRO.observe(el);
  });
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => layoutBubbles());
}

/* 慢寶說一句話。tail 指定尾巴從哪一邊出去 */
function say(text, side = 'bottom', extra = '') {
  return `<div class="bub" data-tail="${side}"${extra}><span>${esc(text)}</span></div>`;
}

/* 上次來訪 —— 用來決定招呼語 */
const SEEN = 'bo_seen';
function daysSinceSeen() {
  const t = +localStorage.getItem(SEEN) || 0;
  if (!t) return null;
  return Math.floor((Date.now() - t) / 86400000);
}
const markSeen = () => localStorage.setItem(SEEN, Date.now());

/* 招呼（進 app 第一眼，慢寶趴著） */
function boGreeting() {
  const d = daysSinceSeen();
  const h = new Date().getHours();
  if (d === null)          return '喔，新的人。……好，先看看吃什麼。';
  if (d >= 3)              return `${d} 天沒來。……好吧，今天吃什麼？`;
  if (h >= 22 || h < 5)    return '這個時間還要煮？……好吧。';
  if (d === 0)             return '又是你。……今天也要吃好的？';
  return '回來啦。今天想吃什麼？';
}

/* 慢寶在各頁講的話 —— 牠整個 app 都在，這裡是牠的嘴巴 */
function boLine(path) {
  const n = menu.size;
  if (path.startsWith('/menu')) {
    if (n === 0) return [BO.sleepy, '空的。……那我先不忙。'];
    if (shoppingDone()) return [BO.satisfied, '都買齊了，回來吧。'];
    return path.endsWith('prep')
      ? [BO.cheeky, '要泡要醃的先處理。你可以拖，食材不會配合。']
      : [BO.satisfied, `這些買齊就夠了，${n} 道份。別把冰箱塞滿。`];
  }
  if (path.startsWith('/recipe/')) {
    const r = byId(+path.split('/')[2]);
    if (!r) return [BO.blank, ''];
    // 每道自己的碎碎念。有 urgentNote 的那幾則已經把提醒寫進去了，不必再靠下面那句罐頭
    if (r.murmur)      return [r.urgentNote ? BO.cheeky : BO.sleepy, r.murmur];
    if (r.urgentNote)  return [BO.cheeky, '這道有東西要先做。先往下看，省得等等卡住。'];
    if (r.stars >= 3)  return [BO.surprised, '這道你確定？……好啦，我信你。'];
    return [BO.sleepy, '這道我熟。照著來就好。'];
  }
  if (path === '/wall') {
    if (n === 0) return [BO.sleepy, '慢慢看。挑吃的，本來就不能催。'];
    if (n <= 3)  return [BO.satisfied, `${n} 道了。還要加？……行啊。`];
    return [BO.cheeky, `${n} 道……你今天是真的有野心喔。`];
  }
  return [n ? BO.satisfied : BO.sleepy, n ? `菜單裡有 ${n} 道。你挑，我等著吃。` : ''];
}

/* ── 小工具 ── */
const cardTime = t => String(t || '')
  .replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '')
  .replace(/約\s*/g, '')            // 「約」拿掉，時間本來就是估的
  .replace(/分鐘/g, '分')
  .replace(/\s+/g, '')
  .replace(/([\d.]+)/g, ' $1 ')     // 原始資料空格不一致，統一重排
  .replace(/\s+/g, ' ').trim();

function fmt(n) {
  const v = Math.round(n * 100) / 100;
  return Number.isInteger(v) ? v : v;
}

/* 份量縮放：number 為 null 代表「適量」這種不縮放的 */
function amountText(num, unit, factor) {
  if (num === null || num === undefined) return unit;
  return fmt(num * factor) + unit;
}

/* 把 unit 裡的括號說明搬到名字後面 */
function splitUnit(unit) {
  const m = String(unit).match(/^([^（(]*)([（(].*)$/);
  return m ? { u: m[1].trim(), note: m[2] } : { u: unit, note: '' };
}

const byId = id => RECIPES.find(r => r.id === id);

/* ══════════ 路由 ══════════ */

const routes = [
  [/^\/$/,                 renderHome],
  [/^\/wall$/,             renderWall],
  [/^\/recipe\/(\d+)$/,    renderRecipe],
  [/^\/menu$/,            renderMenu],
];

let stack = [];            // 走過的路徑，用來判斷前進還是後退
let current = null;

function go(path)      { location.hash = '#' + path; }
function back()        { history.back(); }

function route() {
  const path = (location.hash || '#/').slice(1) || '/';
  const hit = routes.map(([re, fn]) => [path.match(re), fn]).find(([m]) => m);
  if (!hit) return go('/');
  const [m, fn] = hit;

  // 這個路徑在堆疊裡出現過 → 是後退
  const prev = stack.indexOf(path);
  const isBack = prev !== -1 && prev < stack.length - 1;
  if (isBack) stack = stack.slice(0, prev + 1);
  else if (stack[stack.length - 1] !== path) stack.push(path);

  if (path !== '/') document.body.classList.remove('no-tray');

  const vp = $('#viewport');
  const old = current;
  const page = document.createElement('div');
  page.className = 'page ' + (old ? (isBack ? 'in-back' : 'in-fwd') : '');
  fn(page, m);
  vp.appendChild(page);
  current = page;

  if (old) {
    old.className = 'page ' + (isBack ? 'out-back' : 'out-fwd');
    old.addEventListener('animationend', () => old.remove(), { once: true });
    setTimeout(() => old.isConnected && old.remove(), 400);
  }
  page.scrollTop = 0;
  layoutBubbles(page);
  paintTray();
}

window.addEventListener('hashchange', route);

/* ══════════ 首頁 ══════════ */

/* 首頁有兩段：先看到牠在睡，點一下才出現兩個入口 */
let homeGreeted = false;
let homeLine = '';

function renderHome(el) {
  // 招呼語要在 markSeen() 之前算，不然「隔幾天沒來」永遠會是 0 天
  homeLine = boGreeting();
  el.innerHTML = `<div class="home" id="home"></div>`;
  paintHome($('#home', el));
}

function paintHome(box) {
  if (!homeGreeted) {
    // 招呼：倒掛，慢慢晃，不要底部菜單條來打擾
    document.body.classList.add('no-tray');
    box.innerHTML = `
      <div class="wordmark">
        <div class="wm-name">慢寶</div>
        <div class="wm-sub">今天也要好好吃飯</div>
      </div>
      <div class="bo-stage sleep">
        <div class="bo-swing">
          <img src="${BO.sleep}" alt="慢寶">
        </div>
        <img class="bo-branch" src="${BO.sleep}" alt="" aria-hidden="true">
      </div>
      <div class="tap-hint">點一下</div>`;
    box.onclick = () => { homeGreeted = true; markSeen(); paintHome(box); };
    layoutBubbles(box);
    return;
  }
  document.body.classList.remove('no-tray');
  box.onclick = null;
  box.innerHTML = `
    ${say(homeLine, 'bottom', ' data-at="50%"')}
    <div class="bo-stage drape"><img src="${BO.drape}" alt="慢寶"></div>
    <div class="gate">
      <button class="primary" onclick="go('/wall')">
        <div class="g-t">我知道要吃什麼</div>
        <div class="g-s">自己翻，看到想吃的就加進菜單</div>
      </button>
      <button onclick="alert('問答流程還沒做 — 下一步就是它')">
        <div class="g-t">完全沒想法</div>
        <div class="g-s">回答三個問題，慢寶幫你挑</div>
      </button>
    </div>`;
  layoutBubbles(box);
}

/* ══════════ 食譜牆 ══════════ */

let wallQuery = '';

function renderWall(el) {
  el.innerHTML = `
    <div class="topbar">
      <button class="back-btn" onclick="back()">‹</button>
      <div><h1>食譜牆</h1><div class="sub">${RECIPES.length} 道</div></div>
    </div>
    <div class="search">
      <input id="q" placeholder="搜尋名稱、菜系、標籤…" value="${esc(wallQuery)}">
      <button class="clr ${wallQuery ? 'on' : ''}" id="qc">✕</button>
    </div>
    <div id="wall-bg"></div>
    <div class="wrap"><div class="grid" id="grid"></div></div>`;

  const input = $('#q', el), clr = $('#qc', el);
  input.oninput = () => { wallQuery = input.value; clr.classList.toggle('on', !!wallQuery); paintGrid(el); };
  clr.onclick = () => { wallQuery = ''; input.value = ''; clr.classList.remove('on'); paintGrid(el); input.focus(); };
  paintGrid(el);
}

function paintGrid(el) {
  const q = wallQuery.trim().toLowerCase();
  const list = RECIPES
    .filter(r => !q || [r.title, r.subtitle, r.cuisine, ...(r.tags || [])].join(' ').toLowerCase().includes(q))
    .sort((a, b) => b.id - a.id);
  const g = $('#grid', el);
  g.innerHTML = list.length
    ? list.map(cardHTML).join('')
    : '<div class="empty">找不到這道菜。<br>我也沒聽過。</div>';
}

function cardHTML(r) {
  const on = menu.has(r.id);
  return `
    <div class="card">
      <img class="card-img" src="${asset(r.image)}" alt="" loading="lazy" onclick="go('/recipe/${r.id}')">
      <button class="add-btn ${on ? 'on' : ''}" data-id="${r.id}"
              onclick="event.stopPropagation();toggle(${r.id},this)"
              aria-label="加入今日菜單">${on ? '✓' : '＋'}</button>
      <div class="card-b" onclick="go('/recipe/${r.id}')">
        <div class="card-t">${esc(r.title)}</div>
        <div class="card-m">
          <span><i>時間</i>${esc(cardTime(r.time))}</span>
          <span><i>難度</i>${'★'.repeat(r.stars)}${'☆'.repeat(3 - r.stars)}</span>
        </div>

      </div>
    </div>`;
}

/* 加入／移出今日菜單 —— 食譜牆、詳情、之後的推薦結果都用這一顆 */
function toggle(id, btn) {
  menu.has(id) ? menu.delete(id) : menu.add(id);
  saveMenu();
  const on = menu.has(id);
  document.querySelectorAll(`.add-btn[data-id="${id}"]`).forEach(b => {
    b.classList.toggle('on', on);
    b.textContent = on ? '✓' : '＋';
  });
  document.querySelectorAll(`[data-add-label="${id}"]`).forEach(b => {
    b.textContent = on ? '✓ 已在今日菜單' : '＋ 加入今日菜單';
  });
  paintTray();
}

/* ══════════ 食譜詳情 ══════════ */

/* 食譜詳情：上半決定要不要煮，下半才是怎麼煮。不再一路攤到底 */
let recipeTab = 'prep';

function renderRecipe(el, m) {
  const r = byId(+m[1]);
  if (!r) return go('/wall');
  portions = r.basePortions || 2;
  recipeTab = 'prep';
  const on = menu.has(r.id);
  el.innerHTML = `
    <div class="topbar" style="position:absolute;background:none;">
      <button class="back-btn" onclick="back()">‹</button>
    </div>

    <img class="r-hero" src="${asset(r.image)}" alt="">

    <div class="r-card">
      <div class="r-title">${esc(r.title)}</div>
      ${r.subtitle ? `<div class="r-sub">${esc(r.subtitle)}</div>` : ''}
      <div class="r-stats">
        <div class="r-stat">
          <div class="k">時間</div>
          <div class="v">${esc(cardTime(r.time))}</div>
        </div>
        <div class="r-stat">
          <div class="k">難度</div>
          <div class="v">${'★'.repeat(r.stars)}${'☆'.repeat(3 - r.stars)}</div>
        </div>
        <div class="r-stat">
          <div class="k">幾人份</div>
          <div class="portion">
            <button onclick="setPortion(-1,${r.id})">−</button>
            <span class="n" id="pn">${portions}</span>
            <button onclick="setPortion(1,${r.id})">＋</button>
          </div>
        </div>
      </div>
      ${r.timeNote ? `<div class="r-stat"><div class="tn">${esc(r.timeNote)}</div></div>` : ''}
      <button class="r-add ${on ? 'on' : ''}" data-add-label="${r.id}" onclick="toggle(${r.id})">
        ${on ? '✓ 已在今日菜單' : '＋ 加入今日菜單'}
      </button>
    </div>

    ${r.note ? `
      <div class="bo-talk">
        <img src="${BO.cookB}" alt="慢寶">
        ${say(r.note, 'left', ' data-at="58%" data-len="16" data-half="7"')}
      </div>` : ''}

    <div class="r-tabs">
      <button class="on" data-rtab="prep" onclick="setRecipeTab('prep',${r.id})">備料</button>
      <button data-rtab="steps" onclick="setRecipeTab('steps',${r.id})">步驟</button>
    </div>
    <div class="wrap" id="r-body"></div>`;
  paintRecipeBody(el, r);
}

function setRecipeTab(tab, id) {
  recipeTab = tab;
  current.querySelectorAll('[data-rtab]').forEach(b =>
    b.classList.toggle('on', b.dataset.rtab === tab));
  paintRecipeBody(current, byId(id));
}

function paintRecipeBody(el, r) {
  const body = $('#r-body', el);
  if (recipeTab === 'prep') {
    body.innerHTML = `
      ${r.urgentNote ? `<div class="urgent"><h3>先做，不然會卡住</h3><p>${esc(r.urgentNote)}</p></div>` : ''}
      <div id="ings"></div>`;
    paintIngs(el, r);
  } else {
    body.innerHTML = stepsHTML(r) + (r.tips && r.tips.length
      ? `<div class="sect"><div class="sect-t">注意事項</div>
           <ul class="tips">${r.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`
      : '');
  }
  layoutBubbles(el);
}

function setPortion(d, id) {
  const r = byId(id);
  portions = Math.max(1, Math.min(12, portions + d));
  $('#pn', current).textContent = portions;
  if (recipeTab === 'prep') paintIngs(current, r);
}

/* 備料頁：份量和處理方式合成一行。
   原本份量在這裡、處理方式在步驟的「備料」階段，使用者得自己把兩邊拼起來。 */
function paintIngs(el, r) {
  const f = portions / (r.basePortions || 2);
  const notes = new Map((r.prepNotes || []).map(p => [p.name, p]));
  const used = new Set();

  const line = ([name, num, unit]) => {
    const { u, note } = splitUnit(unit || '');
    const p = notes.get(name);
    if (p) used.add(name);
    return `<div class="ing">
      <div class="ing-head">
        <span>${esc(name)}${note ? `<span class="paren">${esc(note)}</span>` : ''}</span>
        <span class="amt">${esc(amountText(num, u, f))}</span>
      </div>
      ${p ? `<div class="ing-how">${esc(p.method)}</div>` : ''}
    </div>`;
  };

  // 醬汁／醃料整組framed起來並掛上名字 —— 步驟裡就只要喊名字，不必重列調味料
  const group = item => {
    const p = notes.get(item.label);
    if (p) used.add(item.label);
    return `<div class="ing-set">
      <div class="ing-set-name">${esc(item.label)}</div>
      ${item.note ? `<div class="ing-set-note">${esc(item.note)}</div>` : ''}
      ${p ? `<div class="ing-set-note">${esc(p.method)}</div>` : ''}
      <div class="ing-set-body">${item.items.map(line).join('')}</div>
    </div>`;
  };

  let html = (r.shoppingList || []).map(item =>
    Array.isArray(item) ? line(item) : group(item)
  ).join('');

  // prepNotes 裡有、但不是單一食材的（醬汁、醃料那類），補在後面
  const extra = (r.prepNotes || []).filter(p => !used.has(p.name));
  if (extra.length) {
    html += extra.map(p => `<div class="ing">
      <div class="ing-head"><span>${esc(p.name)}</span><span class="amt">${esc(p.amount)}</span></div>
      <div class="ing-how">${esc(p.method)}</div>
    </div>`).join('');
  }
  $('#ings', el).innerHTML = html;
}

/* 純備料的階段不進步驟頁 —— 那些內容備料頁已經有了 */
const PREP_PHASE = /備料/;

/* 步驟只出純文字。資料裡殘留的 <strong> 要先剝掉，不然標籤會變成字露出來。 */
function stepText(step) {
  return esc(String(step).replace(/<[^>]+>/g, ''));
}

function stepsHTML(r) {
  let out = '', open = false, skipping = false, skipped = 0;
  (r.steps || []).forEach(s => {
    if (s.startsWith('## ')) {
      const name = s.slice(3);
      if (open) { out += '</ol>'; open = false; }
      skipping = PREP_PHASE.test(name);
      if (skipping) { skipped++; return; }
      out += `<div class="phase">${esc(name)}</div><ol class="steps">`;
      open = true;
    } else {
      if (skipping) return;
      if (!open) { out += '<ol class="steps">'; open = true; }
      out += `<li>${stepText(s)}</li>`;
    }
  });
  out += open ? '</ol>' : '';
  if (skipped) out = `<div class="from-prep">備料完成後，從這裡開始。</div>` + out;
  return out;
}

/* ══════════ 今日菜單 ══════════ */

function renderMenu(el) {
  const sel = RECIPES.filter(r => menu.has(r.id));
  if (!sel.length && (bought.size || haveAtHome.size)) {   // 菜單清空＝這趟結束
    bought.clear(); haveAtHome.clear(); saveBuy();
  }
  el.innerHTML = `
    <div class="topbar">
      <button class="back-btn" onclick="back()">‹</button>
      <div><h1>今日菜單</h1><div class="sub">${sel.length} 道</div></div>
    </div>
    <div class="chips">${sel.map(r => `
      <span class="chip">${esc(r.title)}
        <button onclick="toggle(${r.id});renderMenu(current)" aria-label="移出">✕</button>
      </span>`).join('')}</div>
    ${sel.length ? `
      <div class="bo-talk wait">
        <img src="${BO.drape}" alt="慢寶">
        ${say('你去買，我在家等。反正我也跑不掉。', 'left', ' data-at="46%" data-len="15" data-half="7"')}
      </div>` : ''}
    <div class="wrap">${
      sel.length === 0
        ? `<div class="empty"><img src="${BO.sleepy}" style="width:110px;margin:0 auto 12px">菜單是空的。<br>那我先睡。</div>`
        : `<div class="sect" style="margin:14px 0 0">
             <div class="sect-t">購物清單</div>
             ${buyHTML(sel)}
           </div>`
    }</div>`;
  layoutBubbles(el);
}

/* 買菜狀態：勾起來的、以及家裡已經有的。兩份都存著，關掉再開還在 */
const BOUGHT = 'bo_bought', HAVE = 'bo_have';
let bought     = new Set(JSON.parse(localStorage.getItem(BOUGHT) || '[]'));
let haveAtHome = new Set(JSON.parse(localStorage.getItem(HAVE)   || '[]'));
const saveBuy = () => {
  localStorage.setItem(BOUGHT, JSON.stringify([...bought]));
  localStorage.setItem(HAVE,   JSON.stringify([...haveAtHome]));
};
function toggleBought(name) {
  const on = !bought.has(name);
  on ? bought.add(name) : bought.delete(name);
  saveBuy();
  // 只更新那一列 —— 整頁重繪會把捲動位置洗掉
  current.querySelectorAll('.row.buy').forEach(el => {
    if (el.querySelector('.r-name')?.textContent !== name) return;
    el.classList.toggle('got', on);
    el.querySelector('.tick').textContent = on ? '✓' : '';
  });
  paintTray();                       // 全部勾完的話，底部橫條會變成收工鈕
}
function haveIt(name) {
  haveAtHome.has(name) ? haveAtHome.delete(name) : haveAtHome.add(name);
  bought.delete(name);
  saveBuy(); renderMenu(current); paintTray();
}

/* 收工：把這一趟的勾選和「家裡已經有」全部清掉。
   生鮮用完就沒了，這兩份狀態不該跨到下一趟。 */
function finishShopping() {
  bought.clear(); haveAtHome.clear();
  saveBuy();
  back();                            // 收工就離開清單頁；paintTray 會在換頁時跑
}

const FRESH = {
  meat: ['雞','棒棒腿','豬','牛','肉','魚','蝦','鴨','羊'],
  veg:  ['蘿蔔','洋蔥','大蔥','蔥','辣椒','蒜','瓜','薯','栗','海帶','香蕉','菇','菜','韭','番茄','青椒','高麗','豆','芹'],
  chill:['蛋','奶油','優格','牛奶','起司','乳酪','鮮奶油'],
};
const catOf = n => Object.keys(FRESH).find(k => FRESH[k].some(w => n.includes(w))) || 'groc';

/* 彙總這份菜單要買的東西。買菜清單和底部橫條都靠它，兩邊才不會各算各的 */
function aggregate(sel) {
  const bins = { meat: {}, veg: {}, chill: {}, groc: {}, season: {} };
  const fixed = { meat: [], veg: [], chill: [], groc: [], season: [] };

  const put = (bin, name, num, unit) => {
    const u = splitUnit(unit || '').u;
    if (num === null || num === undefined) {
      if (!fixed[bin].some(x => x[0] === name)) fixed[bin].push([name, u || unit]);
      return;
    }
    const k = name + '||' + u;
    bins[bin][k] ? bins[bin][k].n += num : bins[bin][k] = { name, n: num, u };
  };

  sel.forEach(r => (r.shoppingList || []).forEach(item => {
    if (Array.isArray(item)) {
      const [name, num, unit] = item;
      if (name === '水') return;
      const bin = /鹽|酒|香草精/.test(name) ? 'season' : catOf(name);
      put(bin, name, num, unit);
    } else {
      item.items.forEach(([name, num, unit]) => name !== '水' && put('season', name, num, unit));
    }
  }));

  return { bins, fixed };
}

/* 還要買的（扣掉家裡已經有的） */
function shoppingNames() {
  const sel = RECIPES.filter(r => menu.has(r.id));
  if (!sel.length) return [];
  const { bins, fixed } = aggregate(sel);
  return [...Object.values(bins).flatMap(b => Object.values(b)).map(x => x.name),
          ...Object.values(fixed).flat().map(x => x[0])]
         .filter(n => !haveAtHome.has(n));
}

const shoppingDone = () => {
  const n = shoppingNames();
  return n.length > 0 && n.every(x => bought.has(x));
};

function buyHTML(sel) {
  const { bins, fixed } = aggregate(sel);

  const row = (name, amt) => {
    if (haveAtHome.has(name)) return '';                 // 家裡有的先收起來
    const on = bought.has(name);
    return `<div class="row buy ${on ? 'got' : ''}">
      <button class="tick" onclick="toggleBought('${esc(name).replace(/'/g, "\\'")}')"
              aria-label="${on ? '取消勾選' : '買到了'}">${on ? '✓' : ''}</button>
      <span class="r-name">${esc(name)}</span>
      <span class="r-amt">${esc(amt)}</span>
      <button class="rm" onclick="haveIt('${esc(name).replace(/'/g, "\\'")}')"
              aria-label="家裡已經有">✕</button>
    </div>`;
  };

  const rows = bin => [
    ...Object.values(bins[bin]).map(x => row(x.name, fmt(x.n) + x.u)),
    ...fixed[bin].map(([n, u]) => row(n, u)),
  ].join('');

  const secs = [['meat','肉類海鮮'],['veg','蔬菜水果'],['chill','冷藏'],['groc','雜貨'],['season','調味料']];
  let html = secs.map(([k, label]) => {
    const r = rows(k);
    return r ? `<div class="grp-h">${label}</div>${r}` : '';
  }).join('');

  // 收起來的那些要有路可以回來，不然就是死路
  const home = [...haveAtHome];
  if (home.length) {
    html += `<div class="have-box">
      <div class="have-t">家裡已經有 ${home.length} 樣</div>
      ${home.map(n => `<button class="have-chip" onclick="haveIt('${esc(n).replace(/'/g, "\\'")}')">${esc(n)} ↩</button>`).join('')}
    </div>`;
  }
  return html;
}


/* ══════════ 底部菜單條 ══════════ */

function paintTray() {
  const path = (location.hash || '#/').slice(1) || '/';
  const [face, line] = boLine(path);
  $('#tray-face').src = face;
  $('#tray-txt').textContent = line;
  const badge = $('#tray-badge');
  badge.hidden = menu.size === 0;
  badge.textContent = menu.size;
  const go_ = $('#tray-go');
  const done = path.startsWith('/menu') && shoppingDone();
  go_.firstChild.textContent = done ? '買完了，收工' : (path.startsWith('/menu') ? '關閉' : '今日菜單');
  go_.classList.toggle('finish', done);
}

$('#tray-go').onclick = () => {
  const path = (location.hash || '#/').slice(1);
  if (!path.startsWith('/menu')) return go('/menu');
  return shoppingDone() ? finishShopping() : back();
};

/* ══════════ 起飛 ══════════ */
if (!location.hash) location.hash = '#/';
route();
</script>
