<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F9E6D1">
<title>慢寶</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  /* 底色跟慢寶插畫的背景一致，牠才貼得無縫 */
  --bg:        #F9E6D1;
  --surface:   #FFFCF7;
  --line:      #E8D5BE;
  --text:      #4A3B32;
  --muted:     #8A7361;
  --faint:     #A89380;
  --brand:     #B0724F;
  --brand-dim: #C9977A;
  --gold:      #D9A441;
  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 26px;
  --shadow: 0 2px 10px rgba(120, 90, 60, 0.07);
  --tray-h: 62px;
}
/* 招呼畫面不要底部菜單條 */
body.no-tray { --tray-h: 0px; }
body.no-tray .tray { display: none; }

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;                 /* 捲動交給各頁自己處理 */
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px;
  line-height: 1.6;
}

button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img { display: block; max-width: 100%; }

/* ─────────── 頁面容器與轉場 ─────────── */

#viewport {
  position: fixed;
  inset: 0 0 var(--tray-h) 0;
  overflow: hidden;
}

.page {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;               /* 對話框的 SVG 四周留了透明餘裕，會撐出橫向捲動 */
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  padding: env(safe-area-inset-top) 0 24px;
}

/* 前進：新頁從右邊進來。後退：新頁從左邊進來 */
@keyframes slideInRight { from { transform: translateX(100%); } to { transform: none; } }
@keyframes slideInLeft  { from { transform: translateX(-30%); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes slideOutLeft { from { transform: none; } to { transform: translateX(-30%); opacity: .6; } }
@keyframes slideOutRight{ from { transform: none; } to { transform: translateX(100%); } }

.page.in-fwd  { animation: slideInRight .26s cubic-bezier(.32,.72,0,1) both; }
.page.in-back { animation: slideInLeft  .26s cubic-bezier(.32,.72,0,1) both; }
.page.out-fwd { animation: slideOutLeft .26s cubic-bezier(.32,.72,0,1) both; }
.page.out-back{ animation: slideOutRight .26s cubic-bezier(.32,.72,0,1) both; }

@media (prefers-reduced-motion: reduce) {
  .page.in-fwd, .page.in-back, .page.out-fwd, .page.out-back { animation-duration: .01s; }
}

.wrap { max-width: 720px; margin: 0 auto; padding: 0 14px; }

/* ─────────── 頂端列 ─────────── */

.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: 14px 20px 12px;
  background: linear-gradient(var(--bg) 86%, transparent);
}

.back-btn {
  width: 36px; height: 36px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 19px; color: var(--brand);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.back-btn:active { transform: scale(.93); }
.topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
.topbar .sub { font-size: 12px; color: var(--faint); }

/* ─────────── 首頁 ─────────── */

.home {
  position: relative;
  min-height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px 8px 12px;              /* 左右留很少，插畫要放得開 */
  text-align: center;
}

/* ── 對話框 ──
   泡泡和尾巴是「同一條封閉路徑」，所以接縫不可能存在。
   路徑由 JS 依實際文字尺寸算出來，尾尖座標指定成對準慢寶。 */
.bub {
  position: relative;
  z-index: 2;                        /* 尾巴會伸進慢寶那張圖，不能被蓋掉 */
  display: inline-block;
  padding: 14px 22px;
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  animation: pop .32s cubic-bezier(.34,1.5,.64,1) both;
}
.bub > span { position: relative; z-index: 1; text-wrap: balance; }
.bub > svg {
  position: absolute;
  overflow: visible;
  pointer-events: none;
  filter: url(#wobble);
  transform: translateZ(0);          /* 自成一層 —— 不然別處一重繪，濾鏡就重算一次，會閃 */
}
.bub > svg path {
  fill: var(--surface);
  stroke: var(--line);
  stroke-width: 2.2;
  stroke-linejoin: round;
}
@keyframes pop { from { opacity: 0; transform: translateY(7px) scale(.95); } to { opacity: 1; transform: none; } }

/* ⛔ 首頁不要用 CSS 疊裝飾元素（葉子、樹枝）。試過，看起來就是三個東西拼在一起，
   沒有一棵樹的感覺。樹要有樹感，就得跟慢寶畫在同一張圖裡。 */

/* 招呼頁的標題 —— 牠在睡，不該講話，所以這裡放的是 app 的名字 */
.wordmark { margin-bottom: 18px; animation: pop .4s cubic-bezier(.34,1.5,.64,1) both; }
.wm-name {
  font-size: 34px; font-weight: 700;
  letter-spacing: 8px; text-indent: 8px;      /* 字距補償，視覺才置中 */
  color: var(--text);
}
.wm-sub {
  font-size: 13px; letter-spacing: 3px; text-indent: 3px;
  color: var(--faint); margin-top: 6px;
}

/* ── 封面：一張圖切成好幾層，各層各自動 ──

   同一張 hang_sleep_tree.webp 疊多次，用 clip-path 各露出一塊：

     縱向    0 – 25.6%    枝葉      橫向再切三片，只有兩片會動
             25.4 – 40.4% 主樹枝    不動
             38.6% 以下   慢寶      rotate 擺動

   ⚠️ 兩條帶的重疊不是隨便抓的。慢寶那層一轉，它的裁切上緣也跟著轉 ——
   離支點最遠的身體在 x=198／663（支點 x=52.8%），極限垂直位移 6.8px。
   所以樹枝帶的下緣（40.4%）必須比慢寶層的上緣（38.6%）再低 10px 以上，
   轉到極限時才不會在兩層之間裂出一條縫。
   慢寶層的上緣也必須落在**主樹枝最低點以下**，否則會把樹枝末端一起轉下去，
   從靜止樹枝的下緣露出來 —— 這就是 2026-08-16 那個左端斷枝的 bug。

   枝葉用 skew 不用 rotate：rotate 會讓左右兩叢一上一下，跟樹枝的接合處立刻脫節；
   skew 只有水平位移，原點設在接合線上，那條線位移＝0。 */
.bo-stage { position: relative; }
.bo-stage > img, .bo-stage > .bo-swing { display: block; }

.bo-swing {
  transform-origin: 52.6% 27.3%;     /* 四隻爪抓著樹枝的中點 */
  animation: sway 4.6s ease-in-out infinite;
}
.bo-swing > img { clip-path: inset(33.6% 0 0 0); }

.bo-branch, .bo-leaf-a, .bo-leaf-b, .bo-leaf-c {
  position: absolute; inset: 0;
  width: 100%;
  pointer-events: none;
}
.bo-branch { clip-path: inset(17.0% 0 64.7% 0); }   /* 純樹枝，不動 */

/* 枝葉橫切成三片，切線落在三叢之間的空白處（x=438 / 686 於 900 寬）。
   每一片只畫一次，所以不會有「靜止的和會動的疊在一起」的殘影。

   ⛔ 不要三片一起晃 —— 使用者的原話是「一起晃太機械了」。**只有右邊那兩根動。**
   左邊那叢是一根分岔的枝（兩簇共用一根莖），整叢一起晃才對，但那樣看起來
   會有三根在動；讓它整片不動，剛好剩右邊兩根獨立的枝在晃。
   兩根的幅度和週期都不一樣，而且錯開相位，不然又變成整齊劃一。 */
.bo-leaf-a { clip-path: inset(0 51.7% 83.0% 0);      animation: breeze-b 5.6s ease-in-out infinite; }
.bo-leaf-b { clip-path: inset(0 0 83.0% 51.7%);      animation: breeze-c 3.9s ease-in-out -1.2s infinite; }
.bo-leaf-c { display: none; }                        /* 這版只有兩叢枝葉 */
.bo-leaf-a, .bo-leaf-b { transform-origin: 50% 17.0%; }   /* 枝葉與樹枝的接合線 */

/* ⛔ 葉子帶的下緣要在**主樹枝上緣的最高點**之上，不是在它的中位數之上。
   踩過：切在 21.2%（中位數附近），但樹枝在最左端比較粗、上緣高到 y=130，
   於是有 25px 的樹枝被關進會 skew 的葉子層 —— 動起來就滑出一根獨立的柱子。
   量法：逐欄取最長的深色連續段（長度 ≥30 才算主樹枝，排除細枝），取最小值再往上留 3px。 */

@keyframes sway {
  0%, 100% { transform: rotate(-1.4deg); }
  50%      { transform: rotate(1.4deg); }
}
@keyframes breeze-b {
  0%, 100% { transform: skewX(-2deg); }
  50%      { transform: skewX(2deg); }
}
@keyframes breeze-c {
  0%, 100% { transform: skewX(-3.5deg); }
  50%      { transform: skewX(3.5deg); }
}

@media (prefers-reduced-motion: reduce) {
  .bo-swing, .bo-leaf-a, .bo-leaf-b { animation: none; }
}

/* 慢寶全身站著說話：牠在左，話在右，尾尖指向牠的頭。
   泡泡不撐滿 —— 字少的時候收成內容寬度，整組往中間靠，版面才不會左重右空。 */
.bo-talk {
  display: flex; align-items: flex-start; justify-content: center;
  margin: 18px 12px 0;
}
.bo-talk > img {
  height: 124px; width: auto; max-width: 130px;   /* 姿勢的寬高比差很多，鎖高度視覺份量才一致 */
  object-fit: contain; flex: none; margin-top: 6px;
}
.bo-talk .bub {
  flex: 0 1 auto;                  /* 字多才撐開，字少就收窄 */
  max-width: 230px;                /* 字少的一行也會斷成兩行 —— 泡泡窄了，慢寶才進得了中間 */
  margin-left: -14px;              /* 預設值。碎碎念那塊會逐姿勢覆寫，見 MURMUR_POSES */
  padding: 13px 16px;
  font-size: 13.5px; line-height: 1.75; color: var(--muted);
}

/* 菜單頁的慢寶 —— 牠站中間偏左，泡泡往右延伸到跟清單同一個邊界 */
.bo-talk.wait { align-items: center; margin: 4px 14px 0; padding-left: 14px; }
.bo-talk.wait > img { width: 132px; margin-top: 0; }
.bo-talk.wait .bub { flex: 1; max-width: none; margin-left: -12px; }

/* 泡泡是 inline-block，沒有上限的話會一直往橫向長 ——
   第一次的自我介紹有 100 字，會撐到 1200px 以上、整個溢出視窗。
   跟插畫同寬，讀起來也才像同一塊。 */
/* 高度固定成兩行 —— 句子換來換去，泡泡都不長高，慢寶就不會被推上推下。
   寬度讓它照文字收（只有上限），泡泡才還像泡泡不像看板；
   寬度變化發生在淡出的那 240ms 裡，看不到。 */
.home .bub { margin-bottom: 8px; max-width: min(100%, 430px); }
.home .bub > span {
  display: flex; align-items: center; justify-content: center;
  min-height: 3.2em; text-align: center;
  transition: opacity .24s ease;
}

/* 插畫要依畫面高度收斂 —— 手機上不設上限的話，內容會超過視窗，
   而 flex 置中時上方溢出的部分是捲不到的（對話框就這樣消失了）。
   用寬高比換算成寬度上限，樹枝那層才會跟著一起縮。 */
.bo-stage { width: 100%; max-width: 430px; margin: 0 auto; }
.bo-stage img { width: 100%; }
.bo-stage.sleep { width: min(100%, 430px, 53vh); }    /* 900x675，比 1.333 */
.bo-stage.drape { width: min(100%, 430px, 55vh); }    /* 820x608，比 1.349 —— 樹枝要通到兩邊 */

.lang {
  position: absolute; top: 14px; right: 16px; z-index: 6;
  display: flex; gap: 2px;
}
.lang button {
  min-width: 34px; padding: 5px 8px;
  font-size: 12.5px; letter-spacing: 1px;
  color: var(--faint); border-radius: 999px;
}
.lang button.on { color: var(--brand); background: var(--surface); box-shadow: var(--shadow); }

/* 封面版本：那一頁第一眼就是文字（名字、標語、點一下），看不懂的人必須當場能換，
   所以它站進版面裡、放大、兩顆都給外框。進首頁之後它只是個設定，縮回右上角。 */
.lang.hero { position: static; margin-top: 22px; gap: 8px; }
.lang.hero button {
  min-width: 52px; padding: 8px 15px;
  font-size: 14px; letter-spacing: 2px;
  color: var(--muted);
  border: 1.5px solid var(--line);
  background: var(--surface);
}
.lang.hero button.on {
  color: var(--brand); border-color: var(--brand-dim); font-weight: 700;
}

.tap-hint {
  font-size: 12px; color: var(--faint); letter-spacing: 2px;
  margin-top: 18px; animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

.gate { display: grid; gap: 12px; width: 100%; max-width: 330px; margin-top: 20px; }
.gate button {
  border-radius: var(--r-md);
  padding: 16px 18px;
  text-align: left;
  background: var(--surface);
  box-shadow: var(--shadow);
  border: 1.5px solid transparent;
  transition: border-color .15s, transform .12s;
}
.gate button:active { transform: scale(.98); }
.gate .g-t { font-size: 15.5px; font-weight: 700; }
.gate .g-s { font-size: 12.5px; color: var(--faint); margin-top: 2px; }
.gate .primary { border-color: var(--brand-dim); }

/* ─────────── 食譜牆 ─────────── */

.search {
  position: relative; z-index: 1;   /* 木紋層是絕對定位，不抬起來會被蓋住 */
  margin: 0 14px 14px;
}
.search input {
  width: 100%;
  border: 1.5px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-pill, 999px);
  padding: 11px 40px 11px 18px;
  font-size: 14px; font-family: inherit; color: var(--text);
  outline: none;
}
.search input:focus { border-color: var(--brand-dim); }
.search .clr {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 50%;
  color: var(--faint); font-size: 15px;
  display: none; place-items: center;
}
.search .clr.on { display: grid; }

/* 兩欄的紙片牆 —— 一次看得到四張，一百道也滑得完。
   新的插畫是平塗簡化的，縮小後照樣認得出來（舊的照片就不行）。 */
/* 木牆 —— 貼圖掛在頁面本身。
   ⚠️ 不要用 position:absolute; inset:0 的圖層：在可捲動容器裡那只會撐到
   可視高度，往下滑就滑出木頭了（2026-08-16 踩過）。 */
#wall-page {
  background-image: url('assets/bg/wood.webp');
  background-repeat: repeat;
  background-size: 240px 240px;
}
.grid { display: grid; gap: 16px 12px; grid-template-columns: 1fr 1fr; }
@media (min-width: 620px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.card {
  position: relative;
  padding: 24px 9px 12px;          /* 上方多留白，圖釘才像釘在紙上而不是卡在邊上 */
  transition: transform .12s;
}
.card:active { transform: scale(.97); }

/* 紙：手繪抖動邊，跟對話框同一套濾鏡 —— 這是整個 app 最獨特的特徵 */
.card::before {
  content: ''; position: absolute; inset: 0; z-index: 0;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 16px 13px 15px 12px / 13px 16px 12px 15px;
  filter: url(#wobble);
  transform: translateZ(0);
}
.card > * { position: relative; z-index: 1; }

/* 圖釘 */
.card::after {
  content: ''; position: absolute; z-index: 2;
  left: 50%; top: 8px; margin-left: -5.5px;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 1px 3px rgba(120,90,60,.35), inset -1px -1px 0 rgba(0,0,0,.12);
}

.card-img {
  width: 100%; aspect-ratio: 4 / 3;
  object-fit: cover; background: var(--bg);
  border-radius: 10px;
}
.card-b { padding: 9px 3px 0; }
.card-t { font-size: 13.5px; font-weight: 700; line-height: 1.4; }
.card-m { font-size: 11.5px; color: var(--muted); margin-top: 5px; display: flex; gap: 10px; }
.card-m i { display: none; }

/* ＋ 加入今日菜單 */
.add-btn {
  position: absolute; z-index: 3;
  right: 4px; bottom: 6px;
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 18px; line-height: 1;
  background: var(--surface); color: var(--brand);
  border: 1.5px solid var(--line);
  box-shadow: 0 2px 6px rgba(120,90,60,.14);
  transition: transform .14s, background .14s, color .14s;
}
.add-btn:active { transform: scale(.88); }
.add-btn.on { background: var(--brand); border-color: var(--brand); color: #fff; }

.empty { text-align: center; color: var(--faint); font-size: 13.5px; padding: 40px 20px; }
/* 空狀態的慢寶。趴著那張是橫的，要放大一點才看得出牠旁邊那個空碗 */
.empty-bo { width: 150px; margin: 0 auto 14px; }
/* 食譜牆的底是木紋不是米色 —— 那裡的慢寶必須是去背的，
   不然圖的米色底會在木頭上浮出一個方塊。 */
.grid .empty { grid-column: 1 / -1; }
.empty-bo.wide { width: 230px; }

/* ─────────── 食譜詳情 ─────────── */

/* 封面：圖 → 決定卡疊上來。一屏之內就能決定要不要煮 */
.r-hero { width: 100%; height: 246px; object-fit: cover; background: var(--line); }
.r-card {
  position: relative;
  margin: -30px 14px 0;
  padding: 18px 18px 16px;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: 0 4px 18px rgba(120,90,60,.10);
}
.r-title { font-size: 21px; font-weight: 700; line-height: 1.32; }
.r-sub { font-size: 12.5px; color: var(--faint); margin-top: 3px; }
.r-stats {
  display: flex; align-items: center; gap: 0;
  margin: 14px 0 15px;
}
.r-stat { flex: 1; }
.r-stat + .r-stat { border-left: 1px solid var(--line); padding-left: 14px; }
.r-stat .k { font-size: 10.5px; letter-spacing: 1.5px; color: var(--faint); }
.r-stat .v { font-size: 14.5px; font-weight: 700; margin-top: 2px; white-space: nowrap; }
.portion { display: flex; align-items: center; gap: 3px; margin-top: 1px; }

.r-add {
  width: 100%; padding: 13px;
  border-radius: var(--r-md);
  background: var(--brand); color: #fff;
  font-size: 14.5px; font-weight: 700; letter-spacing: .5px;
  transition: transform .12s, background .15s;
}
.r-add:active { transform: scale(.98); }
.r-add.on { background: var(--gold); color: var(--text); }

/* 備料 / 步驟 分頁 —— 跟今日菜單同一套體例 */
.r-tabs { display: flex; gap: 4px; margin: 22px 14px 14px; }
.r-tabs button {
  flex: 1; padding: 10px 0; font-size: 14px; border-radius: 999px;
  color: var(--muted); background: var(--surface);
}
.r-tabs button.on { background: var(--brand); color: #fff; font-weight: 700; }
.portion button {
  width: 30px; height: 30px; border-radius: 50%;

/* ══════════ 對話框 ══════════
   泡泡＋尾巴＝一條封閉路徑。分成兩個元素畫，抖動濾鏡會讓兩條邊線錯開，
   中間就會出現一條接縫 —— 所以整個外框必須是同一條 path。 */

/* 尾巴只從一邊伸出去，所以餘裕只留那一側 ——
   四邊都留 46px 的話，泡泡一撐到接近滿寬就會多出橫向捲動區。 */
const BUB_EDGE = 8;                 // 線寬和抖動位移的餘裕

function bubPad(tail) {
  const len = (tail.len || 30) + 14;
  return {
    l: tail.side === 'left'   ? len : BUB_EDGE,
    r: tail.side === 'right'  ? len : BUB_EDGE,
    t: BUB_EDGE,
    b: tail.side === 'bottom' ? len : BUB_EDGE,
  };
}

/* w,h = 泡泡本體尺寸；tail = {side, at, len} —— at 是尾尖沿著該邊的位置 */
/* 圓角半徑。⚠️ 泡泡矮的時候一定要收。
   固定 24 的話，上下兩個圓角就吃掉 51px，而單行泡泡只有 50px 高 ——
   尾巴無處可放，路徑會往回折，形狀整個壞掉（2026-08-16 實際出現過缺角）。 */
function bubR(w, h, half) {
  return Math.max(8, Math.min(24, h / 2 - half - 3, w / 2 - half - 3));
}

/* 尾尖沿著那條邊的合法範圍 —— 兩端都要讓開圓角和尾巴根部的半寬 */
function bubAtRange(span, R, half) {
  const lo = R + 4 + half, hi = span - (R + 2) - half;
  return hi < lo ? [span / 2, span / 2] : [lo, hi];
}

function bubblePath(w, h, tail) {
  const p = bubPad(tail);
  const R = bubR(w, h, tail.half || 15);   // 四角刻意給一點差異，才不像 Word
  const r1 = R + 4, r2 = R - 3, r3 = R + 2, r4 = R - 1;
  const x0 = p.l, y0 = p.t, x1 = p.l + w, y1 = p.t + h;
  const half = tail.half || 15;     // 尾巴根部半寬
  const len = tail.len || 30;

  const seg = [];
  seg.push(`M ${x0 + r1} ${y0}`);
  seg.push(`H ${x1 - r2} Q ${x1} ${y0} ${x1} ${y0 + r2}`);

  if (tail.side === 'right') {
    const ty = y0 + tail.at;
    seg.push(`V ${ty - half}`);
    seg.push(`Q ${x1 + len * .55} ${ty - half * .5} ${x1 + len} ${ty}`);
    seg.push(`Q ${x1 + len * .45} ${ty + half * .9} ${x1} ${ty + half}`);
  }
  seg.push(`V ${y1 - r3} Q ${x1} ${y1} ${x1 - r3} ${y1}`);

  if (tail.side === 'bottom') {
    const tx = x0 + tail.at;
    seg.push(`H ${tx + half}`);
    seg.push(`Q ${tx + half * .5} ${y1 + len * .55} ${tx} ${y1 + len}`);
    seg.push(`Q ${tx - half * .9} ${y1 + len * .45} ${tx - half} ${y1}`);
  }
  seg.push(`H ${x0 + r4} Q ${x0} ${y1} ${x0} ${y1 - r4}`);

  if (tail.side === 'left') {
    const ty = y0 + tail.at;
    seg.push(`V ${ty + half}`);
    seg.push(`Q ${x0 - len * .55} ${ty + half * .5} ${x0 - len} ${ty}`);
    seg.push(`Q ${x0 - len * .45} ${ty - half * .9} ${x0} ${ty - half}`);
  }
  seg.push(`V ${y0 + r1} Q ${x0} ${y0} ${x0 + r1} ${y0} Z`);
  return seg.join(' ');
}

/* 量完實際尺寸再畫。
   字型載入前後、換行變化都會改尺寸 —— 所以用 ResizeObserver 盯著，不是畫一次就算了。 */
const bubRO = new ResizeObserver(entries => entries.forEach(e => drawBubble(e.target)));

function drawBubble(el) {
  const w = el.offsetWidth, h = el.offsetHeight;
  if (!w || !h) return;
  const side = el.dataset.tail || 'bottom';
  // at：尾尖沿著那條邊的位置。可寫百分比（"30%"）讓它跟著泡泡寬度走
  const raw = el.dataset.at;
  const span = side === 'bottom' ? w : h;
  let at = raw
    ? (raw.endsWith('%') ? span * parseFloat(raw) / 100 : +raw)
    : (side === 'bottom' ? w / 2 : Math.min(32, h / 2));
  const tail = { side, at, len: +(el.dataset.len || 30), half: +(el.dataset.half || 15) };
  // 台詞短的時候泡泡很矮，寫死的尾尖位置會撞到圓角 —— 夾回圓角讓出來的範圍內
  const [lo, hi] = bubAtRange(span, bubR(w, h, tail.half), tail.half);
  tail.at = Math.max(lo, Math.min(hi, at));
  const p = bubPad(tail);
  const d = bubblePath(w, h, tail);
  let svg = el.querySelector(':scope > svg');
  if (!svg) {
    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'path'));
    el.prepend(svg);
  }
  svg.setAttribute('width', w + p.l + p.r);
  svg.setAttribute('height', h + p.t + p.b);
  svg.style.left = -p.l + 'px';
  svg.style.top  = -p.t + 'px';
  svg.querySelector('path').setAttribute('d', d);
}

function layoutBubbles(root) {
  (root || document).querySelectorAll('.bub').forEach(el => {
    drawBubble(el);
    bubRO.observe(el);
  });
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => layoutBubbles());
}

const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 一句話一個字一個字跑出來。標點後多停一下，唸起來才有呼吸 */
function typeLine(el, text, done) {
  if (REDUCE) { el.textContent = text; done && done(); return () => {}; }
  let i = 0, t, stop = false;
  const tick = () => {
    if (stop) return;
    el.textContent = text.slice(0, ++i);
    if (i < text.length) { t = setTimeout(tick, /[。，、？！…]/.test(text[i - 1]) ? 240 : 52); return; }
    done && done();
  };
  tick();
  return () => { stop = true; clearTimeout(t); el.textContent = text; };
}

/* 一串句子輪流上場。最後一句打完就留著，不淡出 */
function typeSeq(el, lines, last, onDone) {
  let i = 0, cancel = () => {}, t, stop = false;
  const fade = (to, cb) => { el.style.opacity = to; t = setTimeout(cb, REDUCE ? 0 : 240); };
  const next = () => {
    if (stop) return;
    if (i >= lines.length) {
      el.style.opacity = 1;
      cancel = typeLine(el, last, onDone);
      return;
    }
    el.style.opacity = 1;
    cancel = typeLine(el, lines[i++], () => {
      t = setTimeout(() => fade(0, next), REDUCE ? 600 : 1100);   // 讀完停一下再換
    });
  };
  next();
  // 點畫面跳過整段，直接到最後一句
  return () => { stop = true; clearTimeout(t); cancel(); stop = false; i = lines.length; next(); };
}

function murmurPose(r) {
  const hay = `${r.title} ${r.subtitle || ''}`;
  const hit = HOLD_POSES.find(([re]) => re.test(hay));
  // 比對不到就用中性姿勢輪替。取餘數不是隨機 —— 同一道菜每次都是同一張
  return hit ? hit[1] : MURMUR_POSES[r.id % MURMUR_POSES.length];
}

function boLine(path) {
  const n = menu.size;
  if (path.startsWith('/menu')) {
    if (n === 0) return [BO.sleepy, t('D4')];
    if (shoppingDone()) return [BO.satisfied, t('DBUY')];
    return path.endsWith('prep')
      ? [BO.cheeky, t('D6')]
      : [BO.satisfied, t('D5')];
  }
  if (path.startsWith('/recipe/')) {
    const r = byId(+path.split('/')[2]);
    if (!r) return [BO.blank, ''];
    // 每道自己的碎碎念。有 urgentNote 的那幾則已經把提醒寫進去了，不必再靠下面那句罐頭
    return [r.urgentNote ? BO.cheeky : BO.sleepy, L(r, 'murmur') || ''];
  }
  if (path === '/wall') {
    if (n === 0) return [BO.sleepy, t('D1')];
    if (n <= 3)  return [BO.satisfied, t('D2').replace('{n}', n)];
    return [BO.cheeky, t('D3').replace('{n}', n)];
  }
  return [n ? BO.satisfied : BO.sleepy, n ? t('D7').replace('{n}', n) : ''];
}

/* ── 小工具 ── */
/* 時間：兩種語言同一套邏輯 —— 拿掉「約」、一律用分鐘、不換算成小時。

   ⛔ 韓文不要加「약」，也不要寫成「1시간 15분」。
   中文那邊「約」在第一步就被剝掉了，小時也全部換算成分鐘（她 2026-08-16 定的：
   同單位才比得動，10 和 150 擺在一起一眼就知道差幾倍）。
   韓文自己加回「약」和小時，等於兩邊邏輯分岔 —— 2026-08-17 糾正。

   韓文從數字組，不維護死字串：新增食譜自動就有。 */
const cardTime = t => {
  const raw = String(t || '')
    .replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '')
    .replace(/約\s*/g, '')
    .replace(/\s+/g, '');
  if (isKo()) {
    const m = raw.match(/([\d.]+)\s*分鐘?/);
    if (m) return Math.round(+m[1]) + '분';
  }
  return raw
    .replace(/([\d.]+)/g, ' $1 ')
    .replace(/\s+/g, ' ').trim();
};

function fmt(n) {
  const v = Math.round(n * 100) / 100;
  return Number.isInteger(v) ? v : v;
}

/* 份量縮放：number 為 null 代表「適量」這種不縮放的 */
function amountText(num, unit, factor, name) {
  // 沒有數字時，unit 本身就是完整說法（「數朵」「一小撮」），整串翻
  if (num === null || num === undefined) return tr(unit);
  return fmt(num * factor) + counterOf(name, unit);
}

/* 把 unit 裡的括號說明搬到名字後面 */
function splitUnit(unit) {
  const m = String(unit).match(/^([^（(]*)([（(].*)$/);
  return m ? { u: m[1].trim(), note: m[2] } : { u: unit, note: '' };
}

const byId = id => RECIPES.find(r => r.id === id);

/* ══════════ 路由 ══════════ */

const routes = [
  [/^\/$/,                 renderHome],
  [/^\/wall$/,             renderWall],
  [/^\/recipe\/(\d+)$/,    renderRecipe],
  [/^\/menu$/,            renderMenu],
];

let stack = [];            // 走過的路徑，用來判斷前進還是後退
let current = null;

function go(path)      { location.hash = '#' + path; }
function back()        { history.back(); }

function route() {
  const path = (location.hash || '#/').slice(1) || '/';
  const hit = routes.map(([re, fn]) => [path.match(re), fn]).find(([m]) => m);
  if (!hit) return go('/');
  const [m, fn] = hit;

  // 這個路徑在堆疊裡出現過 → 是後退
  const prev = stack.indexOf(path);
  const isBack = prev !== -1 && prev < stack.length - 1;
  if (isBack) stack = stack.slice(0, prev + 1);
  else if (stack[stack.length - 1] !== path) stack.push(path);

  if (path !== '/') document.body.classList.remove('no-tray');

  const vp = $('#viewport');
  const old = current;
  const page = document.createElement('div');
  page.className = 'page ' + (old ? (isBack ? 'in-back' : 'in-fwd') : '');
  fn(page, m);
  vp.appendChild(page);
  current = page;

  if (old) {
    old.className = 'page ' + (isBack ? 'out-back' : 'out-fwd');
    old.addEventListener('animationend', () => old.remove(), { once: true });
    setTimeout(() => old.isConnected && old.remove(), 400);
  }
  page.scrollTop = 0;
  layoutBubbles(page);
  paintTray();
}

window.addEventListener('hashchange', route);

/* 備料頁：份量和處理方式合成一行。
   原本份量在這裡、處理方式在步驟的「備料」階段，使用者得自己把兩邊拼起來。 */
/* 備料的韓文是照 prepNotes 的順序存的，用索引取回來 */
const prepKo = (r, p) => La(r, 'prep', (r.prepNotes || []).indexOf(p));

function paintIngs(el, r) {
  const f = portions / (r.basePortions || 2);
  const notes = new Map((r.prepNotes || []).map(p => [p.name, p]));
  const used = new Set();

  const line = ([name, num, unit]) => {
    const { u, note } = splitUnit(unit || '');
    const p = notes.get(name);
    if (p) used.add(name);
    return `<div class="ing">
      <div class="ing-head">
        <span>${esc(tr(name))}${note ? `<span class="paren">${esc(note)}</span>` : ''}</span>
        <span class="amt">${esc(amountText(num, u, f, name))}</span>
      </div>
      ${p ? `<div class="ing-how">${esc(prepKo(r, p) || p.method)}</div>` : ''}
    </div>`;
  };

  // 醬汁／醃料整組framed起來並掛上名字 —— 步驟裡就只要喊名字，不必重列調味料
  const group = item => {
    const p = notes.get(item.label);
    if (p) used.add(item.label);
    return `<div class="ing-set">
      <div class="ing-set-name">${esc(tr(item.label))}</div>
      ${item.note ? `<div class="ing-set-note">${esc(item.note)}</div>` : ''}
      ${p ? `<div class="ing-set-note">${esc(prepKo(r, p) || p.method)}</div>` : ''}
      <div class="ing-set-body">${item.items.map(line).join('')}</div>
    </div>`;
  };

  /* 要先動手調的東西排最前面 —— 醬先調好，肉才放得進去，這是實際的順序。

     判斷用「這一組有沒有 prepNote」，不是「是不是群組」。
     r4 的「糖」也是群組，但它只是把黑糖白糖放在一起、沒有要先做的動作，
     排到最前面反而怪。有 prepNote＝真的要先動手，那才該提前。 */
  const items = r.shoppingList || [];
  const madeFirst = it => !Array.isArray(it) && notes.has(it.label);
  const render = it => Array.isArray(it) ? line(it) : group(it);
  let html = [...items.filter(madeFirst), ...items.filter(it => !madeFirst(it))]
    .map(render).join('');

  // prepNotes 裡有、但不是單一食材的（醬汁、醃料那類），補在後面
  const extra = (r.prepNotes || []).filter(p => !used.has(p.name));
  if (extra.length) {
    html += extra.map(p => `<div class="ing">
      <div class="ing-head"><span>${esc(tr(p.name))}</span><span class="amt">${esc(p.amount)}</span></div>
      <div class="ing-how">${esc(prepKo(r, p) || p.method)}</div>
    </div>`).join('');
  }
  $('#ings', el).innerHTML = html;
}

/* 純備料的階段不進步驟頁 —— 那些內容備料頁已經有了 */
const PREP_PHASE = /備料/;

/* 步驟只出純文字。資料裡殘留的 <strong> 要先剝掉，不然標籤會變成字露出來。 */
function stepText(step) {
  return esc(String(step).replace(/<[^>]+>/g, ''));
}

function stepsHTML(r) {
  let out = '', open = false, skipping = false, skipped = 0;
  let gi = 0, si = 0;                  // 階段名和步驟各自數，韓文覆蓋層是分開兩個陣列
  (r.steps || []).forEach(s => {
    if (s.startsWith('## ')) {
      const name = La(r, 'stages', gi++) || s.slice(3);
      if (open) { out += '</ol>'; open = false; }
      skipping = PREP_PHASE.test(s.slice(3));
      if (skipping) { skipped++; return; }
      out += `<div class="phase">${esc(name)}</div><ol class="steps">`;
      open = true;
    } else {
      const line = La(r, 'steps', si++) || s;
      if (skipping) return;
      if (!open) { out += '<ol class="steps">'; open = true; }
      out += `<li>${stepText(line)}</li>`;
    }
  });
  out += open ? '</ol>' : '';
  if (skipped) out = `<div class="from-prep">${t('U16')}</div>` + out;
  return out;
}

    <div class="wrap">${
      sel.length === 0
        ? `<div class="empty"><img class="empty-bo wide" src="${BO.lie}" alt="慢寶">
             ${t('E2').replace('。', '。<br>')}</div>`
        : `<div class="sect" style="margin:14px 0 0">
             <div class="sect-t">${t('U21')}</div>
             ${buyHTML(sel)}
           </div>`
    }</div>`;
  layoutBubbles(el);
}

/* 買菜狀態：勾起來的、以及家裡已經有的。兩份都存著，關掉再開還在 */
const BOUGHT = 'bo_bought', HAVE = 'bo_have';
let bought     = new Set(JSON.parse(localStorage.getItem(BOUGHT) || '[]'));
let haveAtHome = new Set(JSON.parse(localStorage.getItem(HAVE)   || '[]'));
const saveBuy = () => {
  localStorage.setItem(BOUGHT, JSON.stringify([...bought]));
  localStorage.setItem(HAVE,   JSON.stringify([...haveAtHome]));
};
function toggleBought(name) {
  const on = !bought.has(name);
  on ? bought.add(name) : bought.delete(name);
  saveBuy();
  // 只更新那一列 —— 整頁重繪會把捲動位置洗掉
  current.querySelectorAll('.row.buy').forEach(el => {
    // ⚠️ 比對用 data-name（中文原名）。韓文模式下畫面上是譯名，
    // 比 textContent 會永遠不相等，勾了不會變色
    if (el.querySelector('.r-name')?.dataset.name !== name) return;
    el.classList.toggle('got', on);
    el.querySelector('.tick').textContent = on ? '✓' : '';
  });
  paintTray();                       // 全部勾完的話，底部橫條會變成收工鈕
}
function haveIt(name) {
  haveAtHome.has(name) ? haveAtHome.delete(name) : haveAtHome.add(name);
  bought.delete(name);
  saveBuy(); renderMenu(current); paintTray();
}

/* 收工：把這一趟的勾選和「家裡已經有」全部清掉。
   生鮮用完就沒了，這兩份狀態不該跨到下一趟。 */
function finishShopping() {
  bought.clear(); haveAtHome.clear();
  saveBuy();
  back();                            // 直接退回她進來的那一頁，不要多插一個畫面
}

/* 買菜分類：照「在店裡走到哪一區」分，不是照食物學分類。

   由上往下比，第一個中的就是 —— 順序不是隨便排的，是照加工程度由高到低。
   加工品的名字會包含原料的名字（辣椒醬 ⊃ 辣椒、蝦醬 ⊃ 蝦、番茄麵醬 ⊃ 番茄），
   反過來永遠不會。所以這個順序讓碰撞結構性地消失，不必靠補關鍵字去補破網。

   踩過的實例：舊版用 Object.keys() 的隱形順序，雞蛋被「雞」抓進肉類、
   醃蝦醬被「蝦」抓進海鮮、昆布魚乾高湯被「魚」抓進海鮮。 */
const CATS = [
  ['season', ['醬油','蠔油','魚露','蝦醬','辣椒醬','辣椒粉','麵醬','番茄醬','味噌',
              '醋','酒','糖','鹽','胡椒','芝麻油','香油','橄欖油','食用油','香草精','高湯']],
  ['chill',  ['蛋','奶油','優格','牛奶','起司','乳酪','鮮奶油','豆腐','泡菜']],
  ['meat',   ['雞','棒棒腿','豬','牛','羊','鴨','魚','蝦','絞肉','五花','梅花']],
  ['veg',    ['蘿蔔','洋蔥','蔥','辣椒','蒜','瓜','薯','栗','海帶','香蕉','菇','菜','韭',
              '番茄','青椒','甜椒','高麗','芹','豆']],
];
/* groc 是 fallback，要保持籠統 —— 它接的是所有沒被認出來的東西 */
const catOf = n => (CATS.find(([, ws]) => ws.some(w => n.includes(w))) || ['groc'])[0];

/* 食譜寫的是料理時的形態，買菜清單要換成貨架上的形態 */
const BUY_AS = { '蒜末': '大蒜' };

/* 彙總這份菜單要買的東西。買菜清單和底部橫條都靠它，兩邊才不會各算各的 */
/* 一個名字一行。單位不同就並列，不要拆成兩行。

   買菜清單回答的是「我要買什麼」，不是「總共幾匙」—— 黑糖在三道菜裡分別用
   茶匙、克、湯匙，你走到貨架前拿的還是一包黑糖。舊版的合併鍵是「名字＋單位」，
   那是把程式好算擺在買菜好用前面，結果同一樣東西被拆成三行。 */
function aggregate(sel) {
  const bins = { meat: {}, veg: {}, chill: {}, groc: {}, season: {} };

  /* 買菜買的是原型，不是備料後的樣子 —— 食譜要蒜末，你在店裡拿的是一整顆大蒜 */
  const put = (name, num, unit) => {
    name = BUY_AS[name] || name;
    const bin = catOf(name);
    const u = splitUnit(unit || '').u;
    const row = bins[bin][name] || (bins[bin][name] = { name, sums: {}, fixed: [] });
    if (num === null || num === undefined) {
      const label = u || unit;                      // 適量、幾滴、複合單位這類加不起來的
      if (label && !row.fixed.includes(label)) row.fixed.push(label);
    } else {
      row.sums[u] = (row.sums[u] || 0) + num;
    }
  };

  sel.forEach(r => (r.shoppingList || []).forEach(item => {
    if (Array.isArray(item)) {
      const [name, num, unit] = item;
      if (name === '水') return;
      put(name, num, unit);
    } else {
      item.items.forEach(([name, num, unit]) => name !== '水' && put(name, num, unit));
    }
  }));

  return bins;
}

/* 一行的份量：能加的先加，加不起來的並列在後面 */
/* 買菜清單預設只寫名字，不寫份量。

   絕大多數東西是整包整盒拿了就走 —— 站在貨架前，「0.25 顆甜椒」「2 根蔥」
   「1 湯匙糖」幫不上任何忙，你不可能買那個量。

   只有這三類要挑份量：
     肉      跟老闆說幾克
     麵      包裝大小差很多，買錯會不夠
     大宗醬料  用量大到要算買幾罐

   ⚠️ 這是白名單，預設是「不顯示」。以前是反過來的（預設顯示，再用
   煮飯單位、調味料整區、個別品項三層黑名單去藏），結果每看到一行礙眼
   就要再補一條例外。翻成白名單之後，新增食譜預設就是乾淨的。

   「麵」要寫成 直麵|麵條|冬粉，不能只寫「麵」—— 不然低筋麵粉、
   煎餅粉或中筋麵粉會一起被拉進來。 */
const SHOW_AMOUNT = name =>
  catOf(name) === 'meat' || /直麵|麵條|冬粉|麵醬|高湯/.test(name);

/* row.fixed（數朵、一小撮、1 湯匙 + 2 茶匙）永遠不顯示 —— 那些是煮飯時的講法 */
const amountOf = row => SHOW_AMOUNT(row.name)
  ? Object.entries(row.sums).map(([u, n]) => fmt(n) + tr(u)).join(' ＋ ')
  : '';

/* 還要買的（扣掉家裡已經有的） */
function shoppingNames() {
  const sel = RECIPES.filter(r => menu.has(r.id));
  if (!sel.length) return [];
  const bins = aggregate(sel);
  return Object.values(bins).flatMap(b => Object.keys(b)).filter(n => !haveAtHome.has(n));
}

const shoppingDone = () => {
  const n = shoppingNames();
  return n.length > 0 && n.every(x => bought.has(x));
};

function buyHTML(sel) {
  const bins = aggregate(sel);

  const row = (name, amt) => {
    if (haveAtHome.has(name)) return '';                 // 家裡有的先收起來
    const on = bought.has(name);
    return `<div class="row buy ${on ? 'got' : ''}">
      <button class="tick" onclick="toggleBought('${esc(name).replace(/'/g, "\\'")}')"
              aria-label="${on ? t('U31') : t('U30')}">${on ? '✓' : ''}</button>
      <span class="r-name" data-name="${esc(name)}">${esc(tr(name))}</span>
      <span class="r-amt">${esc(amt)}</span>
      <button class="rm" onclick="haveIt('${esc(name).replace(/'/g, "\\'")}')"
              aria-label="${t('U32')}">✕</button>
    </div>`;
  };

  const rows = bin => Object.values(bins[bin]).map(x => row(x.name, amountOf(x))).join('');

  const secs = [['meat','U24'],['veg','U25'],['chill','U26'],['groc','U27'],['season','U28']];
  let html = secs.map(([k, label]) => {
    const r = rows(k);
    return r ? `<div class="grp-h">${t(label)}</div>${r}` : '';
  }).join('');

  // 收起來的那些要有路可以回來，不然就是死路
  const home = [...haveAtHome];
  if (home.length) {
    html += `<div class="have-box">
      <div class="have-t">${t('U29').replace('N', home.length)}</div>
      ${home.map(n => `<button class="have-chip" onclick="haveIt('${esc(n).replace(/'/g, "\\'")}')">${esc(n)} ↩</button>`).join('')}
    </div>`;
  }
  return html;
}


/* ══════════ 底部菜單條 ══════════ */

function paintTray() {
  const path = (location.hash || '#/').slice(1) || '/';
  const [face, line] = boLine(path);
  $('#tray-face').src = face;
  $('#tray-txt').textContent = line;
  const badge = $('#tray-badge');
  badge.hidden = menu.size === 0;
  badge.textContent = menu.size;
  const go_ = $('#tray-go');
  const done = path.startsWith('/menu') && shoppingDone();
  go_.firstChild.textContent = done ? t('U23') : (path.startsWith('/menu') ? t('U22') : t('U20'));
  go_.classList.toggle('finish', done);
}

$('#tray-go').onclick = () => {
  const path = (location.hash || '#/').slice(1);
  if (!path.startsWith('/menu')) return go('/menu');
  return shoppingDone() ? finishShopping() : back();
};

/* ══════════ 起飛 ══════════ */
if (!location.hash) location.hash = '#/';
route();
</script>
